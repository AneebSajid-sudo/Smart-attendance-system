<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Attendance System</title>
  <meta name="description" content="AI-powered face recognition attendance system for universities" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ── Global Aurora Background ──────────────────────────── -->
  <div class="global-bg">
    <div class="login-orb orb-1"></div>
    <div class="login-orb orb-2"></div>
    <div class="login-orb orb-3"></div>
  </div>

  <!-- ── Login Screen ──────────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card glass">
      <div class="login-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="url(#grad)" stroke-width="2.5" />
            <path d="M14 32c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="url(#grad)" stroke-width="2.5"
              stroke-linecap="round" />
            <circle cx="24" cy="18" r="5" stroke="url(#grad)" stroke-width="2.5" />
            <path d="M10 14l4 4M38 14l-4 4M24 8v4" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" />
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#818cf8" />
                <stop offset="1" stop-color="#38bdf8" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>Smart Attendance</h1>
        <p>Admin &amp; Teacher Portal</p>
        <small style="display:block;margin-top:6px;color:#475569;font-size:.73rem">Students are recognised by face — no
          login needed for them</small>
      </div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="Enter username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>
        <div id="login-error" class="error-msg hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- ── Main App Shell ────────────────────────────────────── -->
  <div id="app" class="app hidden">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon sm">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="22" stroke="url(#grad2)" stroke-width="2.5" />
              <path d="M14 32c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="url(#grad2)" stroke-width="2.5"
                stroke-linecap="round" />
              <circle cx="24" cy="18" r="5" stroke="url(#grad2)" stroke-width="2.5" />
              <defs>
                <linearGradient id="grad2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#818cf8" />
                  <stop offset="1" stop-color="#38bdf8" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span>SmartAttend</span>
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" href="#dashboard">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-item" data-page="students" href="#students">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </span>
          <span class="nav-label">Students</span>
        </a>
        <a class="nav-item" data-page="courses" href="#courses">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </svg>
          </span>
          <span class="nav-label">Courses</span>
        </a>
        <a class="nav-item" data-page="attendance" href="#attendance">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </span>
          <span class="nav-label">Attendance</span>
        </a>
        <a class="nav-item" data-page="reports" href="#reports">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
          </span>
          <span class="nav-label">Reports</span>
        </a>
        <a class="nav-item" data-page="users" href="#users">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              <line x1="19" y1="8" x2="19" y2="14" />
              <line x1="22" y1="11" x2="16" y2="11" />
            </svg>
          </span>
          <span class="nav-label">Users</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge" id="profile-btn" title="Profile Settings" style="cursor:pointer">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-info">
            <span id="logged-user">Admin</span>
            <small id="user-role-label">Administrator</small>
          </div>
          <span class="role-badge role-admin" id="user-role-badge">ADMIN</span>
        </div>
        <button class="btn-logout" id="logout-btn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">

      <!-- Top Bar -->
      <header class="topbar">
        <button class="mobile-menu-btn" id="mobile-menu-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <!-- Page Views -->
      <div class="page-container">
        <div id="page-dashboard" class="page active"></div>
        <div id="page-students" class="page"></div>
        <div id="page-courses" class="page"></div>
        <div id="page-attendance" class="page"></div>
        <div id="page-reports" class="page"></div>
        <div id="page-users" class="page"></div>
      </div>
    </main>
  </div>

  <!-- Global Toast -->
  <div id="toast-container"></div>

  <!-- Global Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal glass" id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/students.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/users.js"></script>

</body>

</html>
